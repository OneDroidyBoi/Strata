name: Backend foundation (CPU only)
on:
  push:
    paths:
      - 'serve/backends/**'
      - 'serve/test_backends.py'
      - 'tools/*manifest*.py'
      - 'tools/*backend_preflight.py'
      - 'tools/gguf_reader.py'
      - '.github/workflows/backend-foundation.yml'
  pull_request:
    paths:
      - 'serve/backends/**'
      - 'serve/test_backends.py'
      - 'tools/*manifest*.py'
      - 'tools/*backend_preflight.py'
      - 'tools/gguf_reader.py'
      - '.github/workflows/backend-foundation.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate synthetic artifacts and adapter contracts
        run: python -m unittest tools.test_model_manifest serve.test_backends tools.test_backend_preflight
